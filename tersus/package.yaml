name:                tersus
version:             0.1.0.0
github:              "githubuser/tersus"
license:             BSD-3-Clause
author:              "weirdev"
maintainer:          "weirdev@outlook.com"
copyright:           "2024"

extra-source-files:
- lib/lists.tersus
- lib/prelude.tersus
- lib/eq.tersus
- lib/clone.tersus
- lib/string.tersus
- examples/emit.tersus
- bootstrap/emitter.sha256
- examples/mir_verify.tersus
- examples/mir_erase.tersus
- lib/validation.tersus
- lib/stdlib.tersus
- lib/box.tersus
- lib/map.tersus
- lib/set.tersus

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/tersus#readme>

dependencies:
- base >= 4.7 && < 5
- containers
- directory
- filepath
- parsec
- process
- template-haskell

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  tersus-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - tersus
  parity:
    main:                Parity.hs
    source-dirs:         dev/parity
    dependencies:
    - tersus

tests:
  tersus-test:
    main:                TestTersus.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -main-is TestTersus
    dependencies:
    - tersus
