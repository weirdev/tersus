# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/tersus#readme>

dependencies:
- base >= 4.7 && < 5
- containers
- directory
- filepath
- parsec
- process
- template-haskell
- unix

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - bytestring >= 0.10.12 && < 0.13

executables:
  tersus-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - tersus
  parser-seed:
    main:                Main.hs
    source-dirs:         dev/parser-seed
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - tersus
  cache-codec-probe:
    main:                Main.hs
    source-dirs:
    - dev/cache-codec/src
    - test
    other-modules:
    - TestProgramBinary
    - TestProgramBinaryChecks
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - tersus
    - binary >= 0.8.8 && < 0.9
    - bytestring >= 0.10.12 && < 0.13
    - deepseq >= 1.4.4 && < 1.6

  cache-integration-probe:
    main: Main.hs
    source-dirs:
    - dev/cache-codec/integration
    - test
    other-modules:
    - TestHarness
    - TestParserFragments
    - TestSharedCache
    - TestProgramBinary
    - TestProgramBinaryChecks
    - TestProgramBuildIdentity
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - tersus
    - binary >= 0.8.8 && < 0.9
    - bytestring >= 0.10.12 && < 0.13
    - deepseq >= 1.4.4 && < 1.6

  emitter-seed:
    main:                Main.hs
    source-dirs:
    - dev/emitter-seed
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - tersus

  frontend-spike:
    main:                Main.hs
    source-dirs:         dev/frontend-spike
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - tersus

  frontend-diff:
    main:                Main.hs
    source-dirs:
    - dev/frontend-diff
    - test
    other-modules:
    - Differential
    ghc-options:
    - -threaded
    - -rtsopts
    dependencies:
    - tersus
    - bytestring >= 0.10.12 && < 0.13

tests:
  tersus-test:
    main:                TestTersus.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -main-is TestTersus
    dependencies:
    - tersus
    - unix
    - binary >= 0.8.8 && < 0.9
    - bytestring >= 0.10.12 && < 0.13
    - deepseq >= 1.4.4 && < 1.6
