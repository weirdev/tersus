name: Host validation profile

on:
  push:
    branches: [ci-host-profile-nov28]

permissions:
  contents: read

# A newer push to the same branch makes the run it supersedes pointless, so stop it instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  haskell:
    name: ${{ matrix.label || format('Haskell build and tests ({0}/10)', matrix.shard) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [host-emitter]
        include:
          - shard: host-emitter
            label: Host validation (emitter)
            test-groups: testHostValidation:emitter
    # Keep the failure bound independent of the measured turnaround target.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tersus
    steps:
      - uses: actions/checkout@v4

      # (the toolchain: it changes only when the resolver does, so a miss here rarely rebuilds a snapshot)
      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-${{ runner.os }}-${{ hashFiles('tersus/stack.yaml', 'tersus/stack.yaml.lock') }}-shard-${{ matrix.shard }}
          restore-keys: |
            stack-${{ runner.os }}-${{ hashFiles('tersus/stack.yaml', 'tersus/stack.yaml.lock') }}-
            stack-${{ runner.os }}-

      # (the package's own build output: keyed on everything it is made of, and restored from the previous run when
      # only a little of that changed, so stack rebuilds the changed modules instead of all of them)
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: tersus/.stack-work
          key: stack-work-${{ runner.os }}-${{ hashFiles('tersus/package.yaml', 'tersus/stack.yaml', 'tersus/src/**', 'tersus/app/**', 'tersus/test/**', 'tersus/lib/**', 'tersus/examples/**', 'tersus/bootstrap/**') }}-shard-${{ matrix.shard }}
          restore-keys: |
            stack-work-${{ runner.os }}-${{ hashFiles('tersus/package.yaml', 'tersus/stack.yaml', 'tersus/src/**', 'tersus/app/**', 'tersus/test/**', 'tersus/lib/**', 'tersus/examples/**', 'tersus/bootstrap/**') }}-
            stack-work-${{ runner.os }}-

      # `build`, `llvm` and `run` write the IR with the emitter written in Tersus (lib/mir/emit/emit.tersus), which is built with clang the first time from the seed
      # (a release asset pinned by bootstrap/emitter.sha256, fetched and verified on first use) and kept in ~/.cache/tersus under a name made from what it is made of, so a cache entry that is out of date is only not used.
      # This has to be restored before the tests run: the test groups build the emitter (and the programs they build with it) into the same directory, and a restore
      # after them only ever helped the two CLI checks at the end. A restore key of an older entry is still useful, for the same reason: what it holds is named
      # for what it is made of, so what is out of date is only not used.
      - name: Identify runner image
        id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore the emitter and test compilation
        id: tersus-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tersus
          # Restore this shard's previous inventory, not another shard's partial bootstrap cache: the newest, whichever
          # of the fleet's runner images made it (preferring the same image restored an older inventory whenever the
          # image changed between runs, and its tools were all built again).
          key: emitter-${{ runner.os }}-shard-${{ matrix.shard }}-${{ steps.runner-image.outputs.version }}-${{ github.sha }}
          restore-keys: |
            emitter-${{ runner.os }}-shard-${{ matrix.shard }}-

      # The executables built from the pinned seeds (the parser's, the emitter's and the elaborator's F0), which every
      # runner needs before anything else and which change only with their pin: one cache for each, so that a new pin
      # rebuilds only its own seed, and so that what a cache saves is complete (a runner that built none of a seed saves
      # nothing under its key, and the next runner that builds it does). (Their names say what they are made of, so a
      # stale one is only not used.)
      - name: Cache the emitter seed
        uses: actions/cache@v4
        with:
          path: ~/.cache/tersus/seed-*
          key: seed-emitter-${{ runner.os }}-${{ hashFiles('tersus/bootstrap/emitter.sha256', 'tersus/src/LlvmRuntime.hs') }}

      - name: Cache the parser seed
        uses: actions/cache@v4
        with:
          path: ~/.cache/tersus/parser-seed-*
          key: seed-parser-${{ runner.os }}-${{ hashFiles('tersus/bootstrap/parser.sha256', 'tersus/src/LlvmRuntime.hs') }}

      - name: Cache the elaborator seed
        uses: actions/cache@v4
        with:
          path: ~/.cache/tersus/frontend-seed-*
          key: seed-frontend-${{ runner.os }}-${{ hashFiles('tersus/bootstrap/frontend.sha256', 'tersus/src/LlvmRuntime.hs') }}

      # On master the host runner proves every function itself, so the verdicts it saves, which pull requests start
      # from, were given by master's own code.
      - name: Forget restored verdicts for the cold profile
        run: rm -rf ~/.cache/tersus/verdicts-*

      # Stack's GHC 9.6.5 links with -fuse-ld=gold, and the ubuntu-26.04 runner image has no ld.gold, so gcc
      # reports "cannot find 'ld'". ld.bfd takes the same options, so let it answer to that name.
      - name: Provide ld.gold
        run: command -v ld.gold || sudo ln -s "$(command -v ld.bfd)" /usr/local/bin/ld.gold

      - name: Build
        run: stack build --test --no-run-tests

      # The harness prints [PASS]/[FAIL] per case and exits non-zero if any case fails. It runs each group in a process
      # of its own, several at a time, prints [TIME] for each, and adds the results up into one Summary line;
      # `stack test --test-arguments='-j 1'` runs the groups one at a time when a failure needs a quiet log.
      # It loads examples/ relative to the package directory, so run from tersus/.
      - name: Test
        if: ${{ matrix.shard != 'certify' && matrix.shard != 'association' }}
        env:
          GHCRTS: -A16m
          TERSUS_TEST_RTS_STATS: '1'
          TEST_GROUPS: ${{ matrix.test-groups || format('--shard {0}/10', matrix.shard) }}
          HOST_RTS: ${{ startsWith(matrix.shard, 'host') && '-c' || '' }}
        run: |
          python3 dev/ci_resources.py
          python3 dev/ci_resources.py -- /usr/bin/time -v stack test --test-arguments="-j 4 $TEST_GROUPS +RTS -N2 -qg $HOST_RTS -RTS"

      # (the package has two executables and `stack run` without a target runs the first of them, which is `parity`, so
      # every check below names the command line one; without that these steps ran the parity harness instead)
      # (on the runner of testParserBootstrap:2/2, which has the most time to spare)
      - name: Check an example through the CLI
        if: ${{ matrix.shard == 8 }}
        run: stack run tersus-exe -- run examples/frame_facts.tersus

      - name: Certify the current emitter pin
        if: ${{ matrix.shard == 'certify' }}
        run: |
          set -euo pipefail
          unset TERSUS_TEST_APPROVED_BUILD_IDENTITY TERSUS_EMITTER_BUILD_MANIFEST
          stack exec -- emitter-seed profile > "$RUNNER_TEMP/emitter-profile.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/emitter-source.txt"
          time stack exec -- emitter-seed certify "$RUNNER_TEMP/emitter-certified.ll" "$RUNNER_TEMP/emitter-certified.pin" +RTS -A64m -qg -N2 -RTS

      - name: Verify ordinary build emitter selection
        if: ${{ matrix.shard == 'association' }}
        run: |
          set -euo pipefail
          unset TERSUS_TEST_APPROVED_BUILD_IDENTITY TERSUS_EMITTER_BUILD_MANIFEST
          original="$RUNNER_TEMP/emitter-original.pin"
          cp bootstrap/emitter.sha256 "$original"
          trap 'cp "$original" bootstrap/emitter.sha256' EXIT
          # This candidate is a test fixture, never the artifact adopted on master.
          stack exec -- emitter-seed candidate-pin > "$RUNNER_TEMP/emitter-candidate.pin"
          cache_home="${XDG_CACHE_HOME:-$HOME/.cache}"
          prime_seed_cache() {
            local file name dest="$1/tersus"
            mkdir -p "$dest"
            for file in "$cache_home/tersus"/{seed-,parser-seed-,frontend-seed-}*; do
              name=${file##*/}
              if [[ $name =~ ^(seed|parser-seed|frontend-seed)-[0-9a-f]{16}$ && -f $file && ! -L $file && -x $file ]]; then
                cp -p -- "$file" "$dest/"
              fi
            done
          }

          # A stale or absent association already exercises the source route.
          if cmp -s "$original" "$RUNNER_TEMP/emitter-candidate.pin"; then
            printf '%s %064d\n' "$(cut -d' ' -f1 "$original")" 0 > bootstrap/emitter.sha256
            stack build --test --no-run-tests
          fi
          source_home="$RUNNER_TEMP/emitter-source"
          prime_seed_cache "$source_home"
          time XDG_CACHE_HOME="$source_home" stack exec -- tersus-exe llvm examples/loops.tersus > "$RUNNER_TEMP/emitter-source.ll"
          test -n "$(compgen -G "$source_home/tersus/emitter-*")"

          cp "$RUNNER_TEMP/emitter-candidate.pin" bootstrap/emitter.sha256
          stack build --test --no-run-tests
          known_home="$RUNNER_TEMP/emitter-known"
          prime_seed_cache "$known_home"
          time XDG_CACHE_HOME="$known_home" stack exec -- tersus-exe llvm examples/loops.tersus > "$RUNNER_TEMP/emitter-known.ll"
          test -n "$(compgen -G "$known_home/tersus/seed-*")"
          test -z "$(compgen -G "$known_home/tersus/emitter-*")"
          XDG_CACHE_HOME="$known_home" stack test --test-arguments='-j 1 testVerdictLocks +RTS -N1 -qg -RTS' | tee "$RUNNER_TEMP/validator-operation-pin.log"
          grep -Fx '[VALIDATOR_OPERATION_MODE] PIN' "$RUNNER_TEMP/validator-operation-pin.log"
          cmp "$RUNNER_TEMP/emitter-known.ll" "$RUNNER_TEMP/emitter-source.ll"

          # A matching pin must not change the explicit source route used by regeneration.
          source_exe=$(XDG_CACHE_HOME="$source_home" stack exec -- emitter-seed source-executable)
          [[ $source_exe == "$source_home/tersus/emitter-"* && -x $source_exe ]]

      - name: Retain verified ordinary emitter association
        if: ${{ success() && matrix.shard == 'certify' }}
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-emitter-association-${{ github.sha }}
          path: |
            ${{ runner.temp }}/emitter-certified.pin
            ${{ runner.temp }}/emitter-profile.txt
            ${{ runner.temp }}/emitter-source.txt
          if-no-files-found: error

      # The command line itself (the tests call its parts): the emitter in Tersus writes the IR
      - name: Check the emitter in Tersus through the CLI
        if: ${{ matrix.shard == 8 }}
        run: stack run tersus-exe -- llvm examples/loops.tersus > "$RUNNER_TEMP/tersus.ll"

      # A function's verdict is kept under the build of the validator that gave it, and a run uses one build, so the
      # verdicts under any other are never used again: keep only the newest.
      - name: Drop the verdicts of older validators
        if: ${{ !cancelled() && matrix.shard == 'host' }}
        run: |
          namespaces=(~/.cache/tersus/verdicts-*)
          if [ -e "${namespaces[0]}" ]; then ls -dt "${namespaces[@]}" | tail -n +2 | xargs -r rm -rf; fi

      # Keep successfully compiled entries even when later tests or CLI checks fail.
      - name: Save the emitter and test compilation
        if: ${{ !cancelled() && steps.tersus-cache.outputs.cache-hit != 'true' && steps.tersus-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tersus
          key: ${{ steps.tersus-cache.outputs.cache-primary-key }}

  # The association covers the source, so any source or seed change leaves the committed one stale. On master, commit
  # the one shard 8 just certified for this exact commit. The pin is not hashed into it, so the commit does not stale
  # itself, and a push made with GITHUB_TOKEN starts no new run.
  adopt-association:
    name: Adopt the certified emitter association
    needs: haskell
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.haskell.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ordinary-emitter-association-${{ github.sha }}
          path: ${{ runner.temp }}/association

      - name: Commit the association if it changed
        run: |
          set -euo pipefail
          certified="$RUNNER_TEMP/association/emitter-certified.pin"
          pin=tersus/bootstrap/emitter.sha256
          test "$(cat "$RUNNER_TEMP/association/emitter-source.txt")" = "$GITHUB_SHA"
          read -r digest association extra < "$certified" || true
          read -r pinned _ < "$pin" || true
          [[ -z ${extra:-} && $digest == "$pinned" && $association =~ ^[0-9a-f]{64}$ ]]
          if cmp -s "$certified" "$pin"; then echo "The committed association is current."; exit 0; fi
          master_moved() { git fetch --quiet origin master && [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; }
          if master_moved; then echo "Master moved on; its own run adopts for its source."; exit 0; fi
          cp "$certified" "$pin"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Adopt the ordinary-CI emitter association for ${GITHUB_SHA::12}" -- "$pin"
          git push origin HEAD:master || { master_moved && echo "Master moved on; its own run adopts for its source."; }

  complete:
    name: Haskell build and tests
    needs: haskell
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards to pass
        run: test '${{ needs.haskell.result }}' = 'success'
