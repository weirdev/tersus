name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  haskell:
    name: Haskell build and tests
    runs-on: ubuntu-latest
    # (the tests that build the emitter written in Tersus, twice, and compile every program with it are the longest)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tersus
    steps:
      - uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            tersus/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('tersus/stack.yaml', 'tersus/stack.yaml.lock', 'tersus/package.yaml') }}
          restore-keys: stack-${{ runner.os }}-

      # Stack's GHC 9.6.5 links with -fuse-ld=gold, and the ubuntu-26.04 runner image has no ld.gold, so gcc
      # reports "cannot find 'ld'". ld.bfd takes the same options, so let it answer to that name.
      - name: Provide ld.gold
        run: command -v ld.gold || sudo ln -s "$(command -v ld.bfd)" /usr/local/bin/ld.gold

      - name: Build
        run: stack build --test --no-run-tests

      # The harness prints [PASS]/[FAIL] per case and exits non-zero if any case fails.
      # It loads examples/ relative to the package directory, so run from tersus/.
      - name: Test
        run: stack test

      # `build`, `llvm` and `run` write the IR with the emitter written in Tersus (examples/emit.tersus), which is built with clang the first time from the seed
      # bootstrap/emitter.ll and kept in ~/.cache/tersus under a name made from what it is made of, so a cache entry that is out of date is only not used.
      - name: Cache the emitter written in Tersus
        uses: actions/cache@v4
        with:
          path: ~/.cache/tersus
          key: emitter-${{ runner.os }}-${{ hashFiles('tersus/bootstrap/emitter.ll', 'tersus/examples/emit.tersus', 'tersus/lib/*.tersus', 'tersus/src/LlvmRuntime.hs') }}

      - name: Check an example through the CLI
        run: stack run -- run examples/frame_facts.tersus

      # The command line itself (the tests call its parts): the emitter in Tersus, which is the default, and the one in Haskell write the same IR
      - name: Check that both emitters write the same IR through the CLI
        run: |
          stack run -- llvm examples/loops.tersus > "$RUNNER_TEMP/tersus.ll"
          stack run -- --haskell-emitter llvm examples/loops.tersus > "$RUNNER_TEMP/haskell.ll"
          cmp "$RUNNER_TEMP/tersus.ll" "$RUNNER_TEMP/haskell.ll"

  python:
    name: Python prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python python/tests.py
