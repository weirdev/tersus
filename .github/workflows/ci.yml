name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the run it supersedes pointless, so stop it instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  haskell:
    name: Haskell build and tests
    runs-on: ubuntu-latest
    # (the tests that build the emitter written in Tersus, twice, and compile every program with it are the longest)
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tersus
    steps:
      - uses: actions/checkout@v4

      # (the toolchain: it changes only when the resolver does, so a miss here rarely rebuilds a snapshot)
      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-${{ runner.os }}-${{ hashFiles('tersus/stack.yaml', 'tersus/stack.yaml.lock') }}
          restore-keys: stack-${{ runner.os }}-

      # (the package's own build output: keyed on everything it is made of, and restored from the previous run when
      # only a little of that changed, so stack rebuilds the changed modules instead of all of them)
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: tersus/.stack-work
          key: stack-work-${{ runner.os }}-${{ hashFiles('tersus/package.yaml', 'tersus/stack.yaml', 'tersus/src/**', 'tersus/app/**', 'tersus/test/**', 'tersus/lib/**', 'tersus/examples/**', 'tersus/bootstrap/**') }}
          restore-keys: stack-work-${{ runner.os }}-

      # `build`, `llvm` and `run` write the IR with the emitter written in Tersus (examples/emit.tersus), which is built with clang the first time from the seed
      # (a release asset pinned by bootstrap/emitter.sha256, fetched and verified on first use) and kept in ~/.cache/tersus under a name made from what it is made of, so a cache entry that is out of date is only not used.
      # This has to be restored before the tests run: the test groups build the emitter (and the programs they build with it) into the same directory, and a restore
      # after them only ever helped the two CLI checks at the end. A restore key of an older entry is still useful, for the same reason: what it holds is named
      # for what it is made of, so what is out of date is only not used.
      - name: Identify runner image
        id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore the emitter and test compilation
        id: tersus-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tersus
          # Immutable snapshots must change when any build/test input or the runner toolchain changes.
          key: emitter-${{ runner.os }}-${{ steps.runner-image.outputs.version }}-${{ github.sha }}
          restore-keys: emitter-${{ runner.os }}-

      # Stack's GHC 9.6.5 links with -fuse-ld=gold, and the ubuntu-26.04 runner image has no ld.gold, so gcc
      # reports "cannot find 'ld'". ld.bfd takes the same options, so let it answer to that name.
      - name: Provide ld.gold
        run: command -v ld.gold || sudo ln -s "$(command -v ld.bfd)" /usr/local/bin/ld.gold

      - name: Build
        run: stack build --test --no-run-tests

      # The harness prints [PASS]/[FAIL] per case and exits non-zero if any case fails. It runs each group in a process
      # of its own, several at a time, prints [TIME] for each, and adds the results up into one Summary line;
      # `stack test --test-arguments='-j 1'` runs the groups one at a time when a failure needs a quiet log.
      # It loads examples/ relative to the package directory, so run from tersus/.
      - name: Test
        run: stack test

      # (the package has two executables and `stack run` without a target runs the first of them, which is `parity`, so
      # every check below names the command line one; without that these steps ran the parity harness instead)
      - name: Check an example through the CLI
        run: stack run tersus-exe -- run examples/frame_facts.tersus

      # The command line itself (the tests call its parts): the emitter in Tersus writes the IR
      - name: Check the emitter in Tersus through the CLI
        run: stack run tersus-exe -- llvm examples/loops.tersus > "$RUNNER_TEMP/tersus.ll"

      # Keep successfully compiled entries even when later tests or CLI checks fail.
      - name: Save the emitter and test compilation
        if: ${{ !cancelled() && steps.tersus-cache.outputs.cache-hit != 'true' && steps.tersus-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tersus
          key: ${{ steps.tersus-cache.outputs.cache-primary-key }}
