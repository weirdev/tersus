name: Temporary frozen FIRST plus SECOND performance pair

on:
  push:
    branches: [temporary-final-ci-performance-123b6df7]

permissions:
  contents: read

jobs:
  matched-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache the normal Stack toolchain
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-${{ runner.os }}-${{ hashFiles('tersus/stack.yaml', 'tersus/stack.yaml.lock') }}-final-pair
          restore-keys: |
            stack-${{ runner.os }}-${{ hashFiles('tersus/stack.yaml', 'tersus/stack.yaml.lock') }}-
            stack-${{ runner.os }}-
      - name: Select fixed normal Stack and bundled Hpack
        run: |
          set -euo pipefail
          curl --fail --location --max-time 300 https://github.com/commercialhaskell/stack/releases/download/v3.11.1/stack-3.11.1-linux-x86_64.tar.gz -o "$RUNNER_TEMP/stack.tar.gz"
          echo "1fda71e657cd8d355625cc66b61b352699279dfee2664c014a392163bd19a952  $RUNNER_TEMP/stack.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/stack.tar.gz" -C "$RUNNER_TEMP" stack-3.11.1-linux-x86_64/stack
          echo "$RUNNER_TEMP/stack-3.11.1-linux-x86_64" >> "$GITHUB_PATH"
      - name: Provide the runner's linker
        run: command -v ld.gold || sudo ln -s "$(command -v ld.bfd)" /usr/local/bin/ld.gold
      - name: Prepare exact frozen inputs and measure only when clean
        env:
          TERSUS_PAIR_MODE: measure
        run: python3 .github/temporary_final_pair.py
      - name: Retain terminal pair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frozen-b1-qualified-current-performance
          path: |
            ${{ runner.temp }}/tersus-final-pair/result.json
            ${{ runner.temp }}/tersus-final-pair/*.name-status
            ${{ runner.temp }}/tersus-final-pair/*.patch
            ${{ runner.temp }}/tersus-final-pair/*.tracked-hashes.json
            ${{ runner.temp }}/tersus-final-pair/*.stdout
            ${{ runner.temp }}/tersus-final-pair/*.stderr
            ${{ runner.temp }}/tersus-final-pair/*.time.json
            ${{ runner.temp }}/tersus-final-pair/final-certified.pin
          if-no-files-found: error
